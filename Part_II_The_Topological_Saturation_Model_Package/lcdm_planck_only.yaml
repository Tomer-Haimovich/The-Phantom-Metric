# ==============================================================================
# Cobaya Configuration: LambdaCDM (k=6, matched control)
# Dataset: Planck 2018 (TTTEEE+lowE+lensing)
# Likelihood mode: Pure-Python Native (zero clik compile)
# Neutrinos: Standard minimal mass (1 massive m_ncdm = 0.06 eV, N_eff = 3.044)
# ==============================================================================

theory:
  classy:
    extra_args:
      non linear: halofit
      N_ncdm: 1
      m_ncdm: 0.06
      N_ur: 2.0308

likelihood:
  planck_2018_highl_plik.TTTEEE_lite_native: null
  planck_2018_lowl.EE_sroll2: null
  planck_2018_lensing.native: null

params:
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.045, scale: 0.015}
    proposal: 0.005
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.002
    latex: n_\mathrm{s}
  H0:
    prior: {min: 50.0, max: 90.0}
    ref: {dist: norm, loc: 67.4, scale: 0.5}
    proposal: 0.2
    latex: H_0
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.02237, scale: 0.00015}
    proposal: 0.00008
    latex: \Omega_\mathrm{b} h^2
  # Standard LambdaCDM unconstrained 6th parameter
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.1200, scale: 0.0012}
    proposal: 0.0006
    latex: \Omega_\mathrm{c} h^2
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.0544, scale: 0.007}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  Omega_m:
    latex: \Omega_\mathrm{m}
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8
  rs_drag:
    latex: r_\mathrm{d}
  dm_baryon_ratio:
    derived: 'lambda omega_cdm, omega_b: omega_cdm / omega_b'
    latex: \omega_\mathrm{c}/\omega_\mathrm{b}
  a0_unified_1e10:
    derived: 'lambda H0: (299792458.0 * (H0 * 1e3 / 3.08567758e22) / ((16.0/3.0)*(1.0 + 1.0/(16.0*3.141592653589793**2)))) * 1e10'
    latex: a_0\;[10^{-10}\,\mathrm{m\,s^{-2}}]

sampler:
  mcmc:
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.9
    covmat: auto
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.15
    max_tries: 10000
    burn_in: 0

packages_path: ./cobaya_packages
output: chains/lcdm_planck_only
resume: true
